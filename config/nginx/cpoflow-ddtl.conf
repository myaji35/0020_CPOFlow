# Host Nginx reverse proxy for CPOFlow (in front of kamal-proxy:3030)
# Location on server: /etc/nginx/sites-enabled/cpoflow-ddtl
# After editing this file, copy to server and run: nginx -t && systemctl reload nginx
#
# ISS-276: client_max_body_size 50m — 25MB Rails 첨부 상한 + 여유폭
# (원래는 Nginx 기본 1MB라 큰 첨부 업로드 시 413 발생)

server {
    listen 80;
    listen [::]:80;
    server_name cpoflow.ddtl.co.kr;

    # HTTPS 리다이렉트는 Let's Encrypt/certbot이 관리 (certbot 설치 시 자동 삽입)
    # 아래 블록은 HTTP → kamal-proxy 프록시 경로

    # ISS-276: 첨부 업로드 (최대 50MB까지 허용)
    client_max_body_size 50m;
    client_body_timeout  120s;

    # 느린 네트워크(UAE) 대응 버퍼
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
    proxy_connect_timeout 30s;

    # X-Forwarded-* 보존 (kamal-proxy의 forward_headers:true와 함께)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS 블록은 certbot --nginx 실행 시 자동으로 아래에 추가됨.
# certbot이 삽입한 블록에도 반드시 client_max_body_size 50m; 를 유지할 것.
