      effective_date: "시행일: 2025년 1월 1일 | 최종 수정: 2026년 5월 1일"
      intro: "본 이용약관(이하 '약관')은 AtoZ2010 Inc.(이하 '회사')가 운영하는 CPOFlow 서비스의 이용에 관한 권리·의무 및 책임 사항을 규정합니다. 서비스 이용 시 본 약관에 동의하는 것으로 간주합니다."
      t1:
        heading: "서비스 정의"
        body1: "CPOFlow는 구매·조달 업무를 위한 SaaS(Software as a Service) 플랫폼으로, Gmail 연동을 통한 RFQ 자동 감지, 9단계 칸반 워크플로우, AI 기반 문서 분석 기능을 제공합니다."
        body2: "서비스는 AtoZ2010 Inc.가 운영하며, 초대된 직원 및 조직 구성원에게만 접근이 허용됩니다."
      t2:
        heading: "이용 자격"
        body: "다음 조건을 모두 충족하는 경우에만 서비스를 이용할 수 있습니다:"
        age: "만 14세 이상"
        authority: "회사 또는 소속 조직으로부터 서비스 이용 권한을 부여받은 자"
        invited: "관리자로부터 초대된 계정 소지자"
      t3:
        heading: "이용자 의무"
        intro: "이용자는 다음 사항을 준수해야 합니다:"
        no_share: "계정 자격 증명(비밀번호, OAuth 토큰)을 타인과 공유하지 않을 것"
        no_scrape: "서비스를 자동화된 방식으로 무단 크롤링·스크래핑하지 않을 것"
        no_misuse: "서비스를 발주 관리 업무 외의 목적으로 악용하지 않을 것"
        no_law_violation: "대한민국 및 UAE 관련 법령을 위반하는 방식으로 서비스를 이용하지 않을 것"
        must_secure: "계정 이상 접근 발견 시 즉시 회사에 신고할 것"
      t4:
        heading: "지적재산권"
        body1: "CPOFlow 서비스 내 소프트웨어, 디자인, 브랜드, 로고, 문서 등 일체의 지적재산권은 AtoZ2010 Inc.에 귀속됩니다."
        body2: "이용자가 서비스에 업로드한 데이터(발주 정보, 첨부파일 등)의 소유권은 해당 이용자 또는 소속 조직에 있습니다."
      t5:
        heading: "책임 제한"
        llm_title: "AI 분석 결과에 관한 고지"
        llm_body: "CPOFlow는 Anthropic Claude API를 이용하여 RFQ 메일 및 첨부파일을 자동 분석합니다. AI가 생성한 품목명·수량·단가·공급사 정보는 참고용이며, 최종 발주 결정 전 반드시 사용자가 직접 검증해야 합니다. AI 분석 결과에 근거한 발주 오류에 대해 회사는 책임을 지지 않습니다."
        general: "회사는 천재지변, 전쟁, 네트워크 장애, 제3자 서비스(Google, Anthropic) 장애 등 불가항력적 사유로 인한 서비스 중단에 대해 책임을 지지 않습니다."
        service_as_is: "서비스는 현재 상태('as-is')로 제공되며, 특정 목적 적합성에 대한 명시적 보증을 제공하지 않습니다."
      t6:
        heading: "서비스 중단 및 해지"
        body1: "회사는 운영상 필요 또는 이용자의 약관 위반 시 서비스를 일시 중단하거나 계정을 해지할 수 있습니다. 이 경우 가능한 범위에서 사전 고지합니다."
        body2: "이용자는 언제든지 관리자에게 계정 삭제를 요청할 수 있으며, 요청 후 30일 이내에 처리됩니다."
      t7:
