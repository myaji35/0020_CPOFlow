        governing_law: "본 약관은 UAE 연방법을 준거법으로 합니다. 단, 대한민국 서울 지사 소속 이용자와의 분쟁은 대한민국 법률을 우선 적용합니다."
        jurisdiction: "분쟁 발생 시 우선 협의를 통한 해결을 시도하며, 합의 실패 시 UAE Abu Dhabi 또는 대한민국 서울 소재 관할 법원에 소를 제기할 수 있습니다."
      t8:
