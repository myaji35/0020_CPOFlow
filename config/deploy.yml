# Name of your application. Used to uniquely configure containers.
service: cpoflow

# Name of the container image.
image: myaji35/cpoflow

# Deploy to these servers.
# 2026-05-08: SolidQueue를 web 컨테이너에서 분리 — DB 락 경합으로 사용자 요청 지연/5xx 발생.
# worker는 web과 같은 서버(158.247.235.31)에 별도 컨테이너로 실행, 같은 SQLite 볼륨 공유.
# web은 사용자 요청만 처리 → BusyException 빈도 ↓ + Puma 응답성 회복.
servers:
  web:
    hosts:
      - 158.247.235.31
  worker:
    hosts:
      - 158.247.235.31
    cmd: bin/jobs

# Where you keep your container images.
registry:
  server: ghcr.io
  username: myaji35
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - ECOUNT_COM_CODE
    - ECOUNT_USER_ID
    - ECOUNT_API_CERT_KEY
    - ECOUNT_ZONE
    - ECOUNT_ENV
    - CPOFLOW_API_KEY
    - SENTRY_DSN
    # ISS-260: SMTP — .kamal/secrets에 값 채우면 자동 활성화 (미설정 시 :test fallback)
    # 2026-04-27: secrets 누락으로 임시 비활성화 (메일 발송 OFF, :test fallback 동작)
    # SMTP 자격증명 입력 후 아래 5줄 주석 해제하여 재활성화
    # - SMTP_USER_NAME
    # - SMTP_PASSWORD
    # - SMTP_ADDRESS
    # - SMTP_PORT
    # - SMTP_DOMAIN
  clear:
    # 2026-05-08: web 컨테이너에서 SolidQueue 분리 → false. worker 컨테이너가 단독 실행.
    SOLID_QUEUE_IN_PUMA: false
    MAILER_HOST: cpoflow.ddtl.co.kr

# Aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
volumes:
  - "cpoflow_storage:/rails/storage"
  - "/root/.claude:/home/rails/.claude:ro"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

# Configure the image builder.
# 원격 빌드: 서버(AMD64)에서 직접 빌드 → QEMU 크로스 컴파일 제거 → 빌드 속도 3~5배 향상
builder:
  remote: ssh://root@158.247.235.31
  arch: amd64
  cache:
    type: registry
    image: ghcr.io/myaji35/cpoflow-build-cache

# kamal-proxy: 포트 3030 (80은 nginx 점유)
proxy:
  host: cpoflow.ddtl.co.kr
  app_port: 3000
  ssl: false
  forward_headers: true
  response_timeout: 60
  healthcheck:
    interval: 5
    timeout: 180

# Deploy timeout (seconds) - 부팅 느림 진단 전까지 임시 180초 (원래 60초)
# 원인: kamal-proxy healthcheck가 새 컨테이너에서 60초 안에 통과 못함 (PERF 이슈로 별도 추적)
deploy_timeout: 180

# Use SSH as root
ssh:
  user: root
