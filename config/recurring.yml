# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Sync Gmail for all connected accounts.
  # SQLite WAL + Puma+SolidQueue 단일 프로세스에서 15분 간격은 BusyException 빈발(2026-05-07 incident).
  # 1시간으로 완화. 사용자 요청 시 inbox에서 수동 sync 버튼 사용.
  gmail_sync_all:
    class: EmailSyncJob
    queue: default
    schedule: every hour at minute 5

  # Due date notifications (Google Chat + in-app) at 07:00 daily
  due_notifications:
    class: DueNotificationJob
    queue: default
    schedule: every day at 7am

  # ISS-266: 긴급·담당자 미배정 오더 에스컬레이션 (매일 07:30)
  # Order.critical(urgent/high + 마감 경과 + 미배정) → admin/manager에 알림
  overdue_escalation:
    class: OverdueEscalationJob
    queue: default
    schedule: every day at 7:30am

  # HR expiry notifications (visa/contract) at 08:00 daily
  hr_expiry_notifications:
    class: HrExpiryNotificationJob
    queue: default
    schedule: every day at 8am

  # eCountERP 품목 동기화 — 6시간 간격 (BusyException 완화 + ERP 변경 빈도 고려)
  ecount_product_sync:
    class: EcountProductSyncJob
    queue: default
    schedule: every 6 hours

  # eCountERP 거래처 동기화 — 6시간 간격 (오프셋으로 동시 락 방지)
  ecount_customer_sync:
    class: EcountCustomerSyncJob
    queue: default
    schedule: every 6 hours at minute 30

  # Shadow Mode FN detection daily at 02:00 (ISS-045 Phase C4)
  shadow_fn_detection:
    class: ShadowFnDetectorJob
    queue: default
    schedule: every day at 2am

  # Card status 재평가 — UAE 21:00 / KST 02:00
  card_status_reassess:
    class: CardStatusAutoAssignJob
    schedule: every day at 17:00 UTC
    queue: default

development:
  # Sync Gmail every 5 minutes in development for faster testing
  gmail_sync_all:
    class: EmailSyncJob
    queue: default
    schedule: every 5 minutes

  # Due date notifications at 07:00 daily
  due_notifications:
    class: DueNotificationJob
    queue: default
    schedule: every day at 7am

  # ISS-266: 긴급·담당자 미배정 에스컬레이션 (dev에서도 동작 확인용)
  overdue_escalation:
    class: OverdueEscalationJob
    queue: default
    schedule: every day at 7:30am

  # HR expiry notifications (visa/contract) at 08:00 daily
  hr_expiry_notifications:
    class: HrExpiryNotificationJob
    queue: default
    schedule: every day at 8am
