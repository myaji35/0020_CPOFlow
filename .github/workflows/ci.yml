name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager || true
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit || true
        # TODO: gem 업데이트 후 strict 모드로 복원
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # ⭐ 테스트 게이트 (2026-07-15 신설)
  #
  # 왜 지금 추가하는가: 테스트 237개 파일 / 1,406개 test 블록이 있는데
  # ci.yml에 rails test가 0곳이었다 — CI에서 한 번도 실행된 적이 없다.
  # 쓴 테스트가 자산이 되려면 매 push마다 기계가 돌려야 한다.
  #
  # continue-on-error / || true 금지: 경고는 무시된다. 게이트는 차단해야 게이트다.
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev

      # db:prepare는 seeds까지 실행한다. db/seeds.rb는 개발용 샘플 데이터이고
      # Order.priority(스키마에 없는 컬럼)를 7곳에서 참조해 test 환경에서 죽는다.
      # 테스트는 fixtures를 쓰지 않고(test_helper.rb의 `fixtures :all`이 주석)
      # 각 테스트가 필요한 데이터를 직접 만들므로 스키마만 로드하면 충분하다.
      - name: Setup database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bin/rails test

